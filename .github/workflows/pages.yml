name: Publicar artículo
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml', 'Codigo/tests/test_repositorio.py']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar sitio y archivos versionados
        run: python3 -m unittest discover -s Codigo/tests -p test_repositorio.py -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
