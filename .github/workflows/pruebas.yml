name: Verificar proyecto
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Codigo/requisitos.txt
      - name: Instalar paquetes Python
        run: 'python -m pip install --only-binary=:all: -r Codigo/requisitos.txt'
      - name: Comprobar dependencias
        run: python -m pip check
      - name: Probar un clon sin bases ni R instalado
        run: python ejecutar.py --pruebas --sin-instalar
        env:
          PYTHONUTF8: '1'
